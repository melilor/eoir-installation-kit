# Verification evidence register.
#
# One record per verification case (VER item in the Doorstop document under
# model/verification). The verification requirement says what has to be shown;
# this register says how, and with what state of evidence.
#
# method:  analysis | simulation | test | inspection | demonstration | review
# status:  PASS | WARN | FAIL | LIMITATION | BLOCKED | FUTURE
# plan:    for FUTURE, the ticket that will produce the evidence; for any other
#          status, the ticket that produced it
#
# Rules enforced by tools/traceability.py:
#   - every VER item has exactly one record here, and every record names an
#     existing VER item;
#   - PASS and WARN require an artifact that exists on disk;
#   - FUTURE requires a plan (the ticket that will produce the evidence);
#   - FAIL, LIMITATION and BLOCKED require a note.
#
# Revision: H (2026-09-18) — the load path analysis (ticket 07) closed the strength cases,
# recorded the resonance separation as a limitation and changed the attachment geometry that
# did not match the platform provisions.

