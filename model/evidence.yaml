  - verification: VER010
    method: review
    status: LIMITATION
    artifact: docs/qualification-plan.md
    plan: issues/10-qualification-plan-environmental
    note: >-
      The plan selects the applicable sections for the two installation zones and states the
      method and the article for each, and the review of those selections is complete. It does
      not fix every category: six zone selections carry a category that follows from a declared
      input and a public statement about the standard, and thirty are open on a named platform
      input (the compartment map, the altitude, the HIRF and lightning environment, the radio
      compatibility limits, the fluid list). The standard is not in this repository, so a
      category is not invented to fill the gaps.
    note: DO-160G section and category selection per installation zone.

  - verification: VER011
    method: analysis
    status: LIMITATION
    artifact: evidence/loads/checks.json
    plan: issues/07-analysis-load-path-and-strength
    note: >-
      The excitation bands are computed from the declared rotor data and the separation
      criterion is applied to them, but the separation is not demonstrated. The single degree
      of freedom estimate of the installation is 21.9 to 43.3 Hz between the simply supported
      and the clamped idealisation of the frame rails, and that interval crosses the main rotor
      3/rev band and the tail rotor 1/rev band: no admissible window is wide enough to contain
      it, so the uncertainty of the estimate is larger than the distance between the harmonics.
      A modal analysis or a ground vibration test on the first article is required, and
      stiffening the frame enough to clear the bands costs more mass than the kit budget has
      left (OI-02).

  - verification: VER012
    method: review
    status: LIMITATION
    artifact: docs/qualification-plan.md
    plan: issues/10-qualification-plan-environmental
    note: >-
      The plan carries the four protection means the installation provides and states what each
      one is checked against, and the emission and susceptibility entries exist for both zones.
      The review itself cannot be completed: the platform protection plan and the radio
      compatibility limits are referenced by the interface data and not declared, so the
      preservation argument and the emission limits stay open (PP-04, QI-01).
    note: Preservation of the platform lightning and HIRF protection.

