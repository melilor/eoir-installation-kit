# Verification evidence register.
#
# One record per verification case (VER item in the Doorstop document under
# model/verification). The verification requirement says what has to be shown;
# this register says how, and with what state of evidence.
#
# method:  analysis | simulation | test | inspection | demonstration | review
# status:  PASS | WARN | FAIL | LIMITATION | BLOCKED | FUTURE
# plan:    for FUTURE, the ticket that will produce the evidence; for any other
#          status, the ticket that produced it
#
# Rules enforced by tools/traceability.py:
#   - every VER item has exactly one record here, and every record names an
#     existing VER item;
#   - PASS and WARN require an artifact that exists on disk;
#   - FUTURE requires a plan (the ticket that will produce the evidence);
#   - FAIL, LIMITATION and BLOCKED require a note.
#
# Revision: I (2026-09-18) — the qualification plan (ticket 10) closed the coverage and
# protection reviews, recorded the four cases that need an article as limitations, and left
# the category selection open where the platform owns the input.

revision: I
date: 2026-09-18

cases:
  - verification: VER001
    method: analysis
    status: PASS
    artifact: evidence/loads/checks.json
    plan: issues/07-analysis-load-path-and-strength
    note: >-
      Seven load cases derived from the declared accelerations, four fittings at the
      attachment points the layout declares, reactions from the inertia force and the couple
      the force makes below the attachment plane. The manoeuvre case governs: 5.25 g ultimate
      at 59.28 kg gives 763 N at the most loaded fitting against a declared capability of
      25 kN per point.

  - verification: VER002
    method: analysis
    status: PASS
    artifact: evidence/loads/checks.json
    plan: issues/07-analysis-load-path-and-strength
    note: >-
      Factor of safety 1.5 applied to the limit load cases and none applied to the conditions
      the platform prescribes as ultimate, as 27.303 requires. Critical section stresses are
      two orders of magnitude below the declared allowables: the strength checks do not size
      this installation. The material allowables are declared handbook values (A-014) and the
      emergency landing factors are platform data, not a clause of 27.561 for a belly
      installation (OI-01).

  - verification: VER003
    method: analysis
    status: PASS
    artifact: evidence/mass/checks.json
    plan: issues/04-analysis-mass-and-balance
    note: >-
      Kit mass 13.60 kg against the 15 kg target, and the platform CG computed for four
      configurations: worst case 2987.0 mm aft of datum against a forward limit of 2900 mm
      (87 mm of margin). Every mass is a declared estimate and the platform data are declared
      inputs: the result is a bound, not a weighing.

  - verification: VER004
    method: analysis
    status: PASS
    artifact: evidence/mass/checks.json
    plan: issues/04-analysis-mass-and-balance
    note: >-
      The load cases use the payload at its declared 45 kg and at both CG envelope limits
      (±150 mm), which is the worst case by construction. A payload heavier than declared, or
      with a CG outside the envelope, is a design change and not covered.

  - verification: VER005
    method: analysis
    status: PASS
    artifact: evidence/clearance/checks.json
    plan: issues/05-analysis-fov-and-clearance
    note: >-
      The swept sector (elevation -120 to +30 deg, head radius 190 mm) is clear of every
      declared structural element over 301 sampled rays, and the tightest direction keeps
      30 mm against the 25 mm requirement. The first run of the analysis found the belly
      antenna inside the sector (229 of 301 rays obstructed): the antenna moved outboard and
      out of the removal corridor.

  - verification: VER006
    method: analysis
    status: PASS
    artifact: evidence/power/checks.json
    plan: issues/06-analysis-power-and-bonding
    note: >-
      Continuous current 5.36 A over 2.4 m of 2.5 mm2 copper: 0.180 V of drop against a 2 %
      limit of 0.560 V. Peak current 14.29 A: 0.480 V against 4 % (1.120 V). Conductor ampacity
      20 A, breaker 20 A against a required 17.86 A, bus load 2251 W of 3000 W. The payload
      demand and the bus data are declared inputs.

  - verification: VER007
    method: inspection
    status: LIMITATION
    artifact: evidence/power/checks.json
    plan: issues/06-analysis-power-and-bonding
    note: >-
      The protection is coordinated on the steady and peak demand, and the value to enter in
      the platform electrical load analysis is computed and identified. Two items are open and
      recorded in model/power.yaml: the declared 25 A inrush exceeds the 20 A breaker rating
      and the trip curve is not available, and the load analysis entry itself has to be made
