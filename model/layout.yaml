# Layout definition of the installation kit — the single source of truth for
# every dimension of the study.
#
# This is a two-view 2D envelope model (side view and bottom view): rectangles,
# circles and orthogonal harness paths. It is not a 3D CAD model; that
# simplification is declared, not hidden. Everything published — the checks, the
# report, the SVG figure and the DXF export — is generated from this file by
# tools/layout.py, so no dimension is typed twice.
#
# Coordinates are millimetres. Bottom view: x longitudinal (forward positive),
# y lateral (right positive). Side view: x longitudinal, y vertical (up
# positive), the platform skin at y = 0.

revision: A
date: 2026-09-18
units: mm

# Design rules of the study. They are declared inputs, like an assumption: they
# are not yet confirmed against a platform installation standard.
declared_rules:
  edge_distance_factor: 2.0        # multiple of the fastener diameter, to the fitting edge (A-013)
  hole_pitch_factor: 3.0           # multiple of the fastener diameter, between holes (A-013)
  connector_access_radius: 60      # free radius around a payload connector (A-012)
  inspection_access_radius: 80     # free radius around a fitting (SYS019, SYS028)
  harness_clearance: 50            # from hot zones and moving parts (A-012)
  clamp_spacing_max: 200           # between consecutive clamps (A-012)
  bend_radius_factor: 5.0          # multiple of the cable outside diameter (A-012)
  minimum_clearance_mm: 25         # SYS009, assumption A-005

side_view:
  platform_skin_y: 0
  frame_members:
    - { id: SM-01, name: Forward attachment structure, rect: [-520, -260, -380, -40] }
    - { id: SM-02, name: Aft attachment structure, rect: [380, -260, 520, -40] }
    - { id: SM-03, name: Belly beam, rect: [-60, -120, 60, -40] }
    - { id: SM-04, name: Belly antenna, relocated outboard of the swept volume, rect: [-520, -660, -380, -600] }
    - { id: SM-05, name: Lower fuselage step, right side, rect: [220, -450, 260, -390] }
  payload_envelope:
    id: PE-01
    rect: [-190, -480, 190, -40]
  removal_corridor:
    id: RC-01
    rect: [-260, -980, 260, -500]
  # The rotating head sweeps a sector around the gimbal axis. head_radius_mm is
  # the distance from the gimbal centre to the outer surface of the rotating
  # head, taken from the payload envelope. The elevation range is read from the
  # payload interface data by tools/clearance.py; the sector is bounded by
  # sampling one ray every ray_step_deg.
  field_of_view:
    gimbal_centre: [0, -420]
    head_radius_mm: 190
    ray_step_deg: 0.5

bottom_view:
  payload_footprint:
    id: PF-01
    rect: [-190, -230, 190, 230]
  frame_members:
    - { id: BL-01, name: Left rail, rect: [-510, 130, 510, 170] }
    - { id: BL-02, name: Right rail, rect: [-510, -170, 510, -130] }
    - { id: BM-01, name: Mid beam, rect: [-30, -170, 30, 170] }
  fittings:
    # The four fittings carry the bolt patterns that mate with the platform hard
    # points. Their bolt-pattern centres form a rectangle: the spacing is checked
    # against the platform interface control data by tools/layout.py
    # (ATTACHMENT-SPACING), because the load path in model/loads.yaml assumes it.
    - { id: FT-01, rect: [-510, -210, -390, -90] }
    - { id: FT-02, rect: [390, -210, 510, -90] }
    - { id: FT-03, rect: [-510, 90, -390, 210] }
    - { id: FT-04, rect: [390, 90, 510, 210] }
  fasteners:
    - { id: F-01, fitting: FT-01, position: [-480, -180], diameter: 8, locking_devices: 2 }
    - { id: F-02, fitting: FT-01, position: [-420, -120], diameter: 8, locking_devices: 2 }
    - { id: F-03, fitting: FT-02, position: [480, -180], diameter: 8, locking_devices: 2 }
    - { id: F-04, fitting: FT-02, position: [420, -120], diameter: 8, locking_devices: 2 }
    - { id: F-05, fitting: FT-03, position: [-480, 180], diameter: 8, locking_devices: 2 }
    - { id: F-06, fitting: FT-03, position: [-420, 120], diameter: 8, locking_devices: 2 }
    - { id: F-07, fitting: FT-04, position: [480, 180], diameter: 8, locking_devices: 2 }
    - { id: F-08, fitting: FT-04, position: [420, 120], diameter: 8, locking_devices: 2 }
  connectors:
    - { id: CN-01, name: Payload power connector, position: [0, 250], access_radius: 60 }
    - { id: CN-02, name: Payload data connector, position: [120, 250], access_radius: 60 }
  inspection_zones:
    - { id: IZ-01, fitting: FT-01, rect: [-540, -240, -360, -60] }
    - { id: IZ-02, fitting: FT-02, rect: [360, -240, 540, -60] }
    - { id: IZ-03, fitting: FT-03, rect: [-540, 80, -360, 260] }
    - { id: IZ-04, fitting: FT-04, rect: [360, 80, 540, 260] }
  hot_zones:
    - { id: HZ-01, name: Exhaust and bleed duct zone, rect: [230, -60, 300, 90] }
  moving_parts:
    - { id: MP-01, name: Retraction linkage sweep, rect: [-300, -80, -230, 90] }
  harnesses:
    - id: HR-01
      name: Power harness
      cable_od: 14
      bend_radius: 80
      path: [[-450, -150], [-450, 150], [-30, 150], [-30, 250], [0, 250]]
      clamps: [[-450, -50], [-450, 100], [-350, 150], [-200, 150], [-50, 150], [-30, 220]]
    - id: HR-02
      name: Data harness
      cable_od: 10
      bend_radius: 60
      path: [[450, -150], [450, 150], [60, 150], [60, 250], [120, 250]]
      clamps: [[450, -50], [450, 100], [350, 150], [200, 150], [70, 150], [60, 250]]

# Declared interface data the layout has to agree with. The check resolves each
# dotted path inside the interface control file and compares the value.
interface_refs:
  - { label: Payload mass, icd: model/interfaces/icd_payload.yaml, path: mass_and_inertia.mass_kg, expect: 45 }
  - { label: Payload power voltage, icd: model/interfaces/icd_payload.yaml, path: power.voltage_vdc, expect: 28 }
  - { label: Platform attachment spacing, icd: model/interfaces/icd_platform.yaml, path: attachment_provisions.spacing_mm.longitudinal, expect: 900 }
