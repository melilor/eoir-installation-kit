name: CI

on:
  push:
  pull_request:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate the Doorstop documents
        run: doorstop --no-ref-check --no-level-check
      - name: Validate the traceability model
        run: python -m tools.traceability check
      - name: Check that the traceability matrix is up to date
        run: python -m tools.traceability report --check
      - name: Check that the architecture document is up to date
        run: python -m tools.diagram --check
      - name: Run the layout checks and verify the published evidence
        run: python -m tools.layout --check
      - name: Check that the compliance matrix is up to date
        run: python -m tools.compliance --check
      - name: Run the mass and balance analysis and verify the published evidence
        run: python -m tools.mass --check
      - name: Run the field of view analysis and verify the published evidence
        run: python -m tools.clearance --check
      - name: Run the electrical analysis and verify the published evidence
        run: python -m tools.power --check
      - name: Run the load path analysis and verify the published evidence
        run: python -m tools.loads --check
      - name: Run the tests
        run: python -m pytest
